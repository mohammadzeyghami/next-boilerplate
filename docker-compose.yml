# Colima / Docker: `colima start` then `docker compose up -d`
services:
  db:
    image: postgres:16-alpine
    container_name: next-boilerplate-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: myapp_auth
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d myapp_auth"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
